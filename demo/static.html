<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-viewer demo</title>
<style>
  :root { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --text: #f5f5f7; --muted: #a1a1a9; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
  main { max-width: 820px; margin: 0 auto; padding: 48px 16px 96px; }
  h1 { margin: 0 0 8px; font-size: 32px; }
  p { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 14px; color: var(--muted); margin: 48px 0 12px; font-weight: 600; }
  a { color: #0071e3; }
</style>
</head>
<body>
<main>
  <h1>slide-viewer</h1>
  <p>Embed PDF / PowerPoint slides in any web page with one script tag. <a href="https://github.com/YoshitoSuzuki/slide-viewer">GitHub</a></p>

  <h2>Downloadable deck</h2>
  <div class="slide-viewer" data-deck="usage" data-static="decks/"></div>

  <h2>Download disabled · scrambled tiles · 4:3</h2>
  <div class="slide-viewer" data-deck="locked" data-static="decks/" data-thumbs="open"></div>
</main>
<script src="../slide-viewer/slide-viewer.js" defer></script>
</body>
</html>
